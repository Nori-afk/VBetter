<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost and Found Management | VBetter</title>
    <link rel="stylesheet" href="/Vet-side/CSS/sideBar.css">
    <link rel="stylesheet" href="/Vet-side/CSS/lostandFound.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="/Vet-side/JS/sidebar.js" defer></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
    <script src="/Vet-side/JS/L&F.js" defer></script>
</head>
<body>
    <div class="main-holder lf-page">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo"><img src="../Images/logo.png" alt="VBETTER Logo"></div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item" title="Dashboard">
                    <img src="/Vet-side/Images/home-notactive.svg" class="nav-icon" alt="Dashboard icon">
                    <span class="nav-label">Dashboard</span>
                </a>
                <a href="appointment.html" class="nav-item" title="Appointments">
                    <img src="/Vet-side/Images/n.svg" class="nav-icon" alt="Appointment management icon">
                    <span class="nav-label">Appointment Management</span>
                </a>
                <a href="patientRecords.html" class="nav-item" title="Patient Records">
                    <img src="/Vet-side/Images/paw.svg" class="nav-icon" alt="Patient records icon">
                    <span class="nav-label">Patient Records</span>
                </a>
                <a href="report.html" class="nav-item" title="Reports">
                    <img src="/Vet-side/Images/graph.svg" class="nav-icon" alt="Reports icon">
                    <span class="nav-label">Report</span>
                </a>
                <a href="DiseaseAnalytics.html" class="nav-item" title="Disease Analytics">
                    <img src="/Vet-side/Images/graph2.svg" class="nav-icon" alt="Disease analytics icon">
                    <span class="nav-label">Disease Analytics</span>
                </a>
                <a href="Lost&Found.html" class="nav-item active" title="Lost and Found">
                    <img src="/Vet-side/Images/lostandFound-active.svg" class="nav-icon" alt="Lost and found icon">
                    <span class="nav-label">Lost And Found</span>
                </a>
                <a href="chatbotmanagement.html" class="nav-item" title="Chatbot Management">
                    <img src="/Vet-side/Images/chatbot.svg" class="nav-icon" alt="Chatbot management icon">
                    <span class="nav-label">Chatbot Management</span>
                </a>
                <a href="MassVacc.html" class="nav-item" title="Mass Vaccination">
                    <img src="/Vet-side/Images/vaccine.svg" class="nav-icon" alt="Mass vaccination icon">
                    <span class="nav-label">Mass Vaccination</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <img src="https://via.placeholder.com/40" alt="Profile" class="profile-pic">
                <span class="nav-label">Lost And Found</span>
            </div>
        </aside>

        <main class="lf-main">
            <section class="lf-hero card">
                <div>
                    <h1>Lost And Found Management</h1>
                    <p>Review reports, validate claims, and resolve pet match workflows.</p>
                </div>
                <button class="btn btn-primary" id="uploadFoundBtn">Upload Found Pet</button>
            </section>

            <section class="lf-stats" id="statsRow"></section>

            <section class="lf-tabbar" id="tabBar"></section>

            <section class="lf-toolbar card">
                <label class="search-box" for="searchInput">
                    <input id="searchInput" type="text" placeholder="Search breed, name, or location..." aria-label="Search lost and found reports">
                </label>
                <select id="typeFilter" aria-label="Select report type"></select>
                <select id="sourceFilter" aria-label="Select source"></select>
                <select id="barangayFilter" aria-label="Select barangay"></select>
            </section>

            <section id="lfContent" class="lf-content"></section>
        </main>
    </div>

    <div id="lfModalOverlay" class="lf-modal-overlay" hidden>
        <section class="lf-modal" role="dialog" aria-modal="true" aria-labelledby="lfModalTitle">
            <button type="button" class="modal-close" id="closeModalBtn" aria-label="Close modal">&times;</button>
            <div id="lfModalBody"></div>
        </section>
    </div>
</body>
</html>
