<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBetter - Patient Records</title>
    <link rel="stylesheet" href="/Vet-side/CSS/sideBar.css">
    <link rel="stylesheet" href="/Vet-side/CSS/patientRecord.css">
</head>
<body>
    <div class="main-holder">
         <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo"><img src="../Images/logo.png" alt="VBETTER Logo"></div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item" title="Dashboard">
                    <img src="/Vet-side/Images/home.png" class="nav-icon" alt="Dashboard-icon">
                    <span class="nav-label">Dashboard</span>
                </a>
                <a href="appointment.html" class="nav-item" title="Patients">
                    <img src="/Vet-side/Images/paw.svg" class="nav-icon" alt="Patient_record-icon">
                    <span class="nav-label">Appointment Management</span>
                </a>
                <a href="patientRecords.html" class="nav-item active" title="Appointments">
                    <img src="/Vet-side/Images/n.svg" class="nav-icon" alt="Appointment-icon">
                    <span class="nav-label">Patient Records</span>
                </a>
                <a href="#" class="nav-item" title="Reports">
                    <img src="/Vet-side/Images/graph.svg" class="nav-icon" alt="Reports-icon">
                    <span class="nav-label">Report</span>
                </a>
                 <a href="#" class="nav-item" title="Disease_Analytics">
                    <img src="/Vet-side/Images/graph2.svg" class="nav-icon" alt="Disease Analytics-logo ">
                    <span class="nav-label">Disease Analytics</span>
                </a>
                  <a href="#" class="nav-item" title="lost_&_found">
                    <img src="/Vet-side/Images/lostandFound.svg" class="nav-icon" alt="Lost and Found-logo" >
                    <span class="nav-label">Lost And Found</span>
                </a>
                  <a href="#" class="nav-item" title="chatbot_insights">
                    <img src="/Vet-side/Images/chatbot.svg" class="nav-icon" alt="Chatbot-logo">
                    <span class="nav-label">Chatbot Management</span>
                </a>
                  <a href="#" class="nav-item" title="Mass_Vaccine">
                    <img src="/Vet-side/Images/vaccine.svg" class="nav-icon" alt="Vaccine-logo">
                    <span class="nav-label">Mass Vaccination</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <img src="https://via.placeholder.com/40" alt="Profile" class="profile-pic">
                <span class="nav-label">Patient Records</span>
            </div>
        </div>
        <div class="right-side">
            <div id="records-app" class="records-app"></div>
            <div class="modal-overlay" id="records-modal-overlay" hidden>
                <section class="modal-shell" id="records-modal-shell" role="dialog" aria-modal="true" aria-labelledby="records-modal-title">
                    <button type="button" class="modal-close" id="records-modal-close" aria-label="Close modal">&times;</button>
                    <div id="records-modal-content"></div>
                </section>
            </div>
        </div>
    </div>
</body>
<script src="/Vet-side/JS/sidebar.js"></script>
<script src="/Vet-side/JS/records.js"></script>
</html>
